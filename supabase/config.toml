[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
# official + drinks は本番でも可。local_demo はローカル専用（評価・個別レシピ）。
sql_paths = [
  "./seeds/official_cocktails.sql",
  "./seeds/drinks.sql",
  "./seeds/local_demo.sql",
  "./seeds/local_zero_hit.sql",
]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"

[auth.external.google]
enabled = false

[storage]
enabled = true
