version: 2

updates:
  # =========================================
  # ① ルートのみ（pnpm workspace + lockfile）
  # =========================================
  # pnpm の lockfile はルートだけなので、/apps/* に別エントリを置くと
  # package.json だけ更新されて pnpm-lock.yaml が追従せず CI が落ちる。
  # Expo / RN は SDK 互換が必要なため Dependabot 対象外（手動で expo install）。
  - package-ecosystem: 'npm' # pnpm でも npm として扱う
    directory: '/' # ルート（pnpm-lock.yaml がある場所）
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Vancouver'
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'chore'
      include: 'scope'

    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: 'nativewind'
      - dependency-name: 'react-native-css'
      - dependency-name: 'react-native-reanimated'
      - dependency-name: 'react-native-worklets'

    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'

      next:
        patterns:
          - 'next'
          - 'eslint-config-next'

      ui:
        patterns:
          - '@radix-ui/*'
          - 'lucide-react'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'class-variance-authority'
          - 'clsx'
          - 'tailwind-merge'

      frontend-tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript'
          - 'prettier'
          - 'prettier-*'

      # minor / patch はまとめてOK
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # =========================================
  # ② GitHub Actions（CIの依存更新）
  # =========================================
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Vancouver'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
