name: Build & Lint Check

# いつ実行するか
on:
  pull_request: # PR作成・更新時
  push:
    branches:
      - main # mainにpushされた時

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # リポジトリを取得
      - uses: actions/checkout@v7

      # pnpmをセットアップ（packageManager と揃える）
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.20.0

      # Node.jsをセットアップ
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm' # pnpmのcache有効化（高速化）

      # 依存インストール（lockfile厳密）
      - run: pnpm install --frozen-lockfile

      # lintチェック（ESLintなど）
      - run: pnpm lint

      # 型チェック（turbo: 各 workspace の type-check）
      - run: pnpm type-check

      # Mobile: Expo SDK 互換性チェック（expo-doctor は package.json で exact pin）
      - name: Expo Doctor (mobile)
        working-directory: apps/mobile
        run: pnpm exec expo-doctor

      # TODO:テスト実行（今後テストコードを追加する場合）
      # - run: pnpm test

      # buildチェック（壊れてないか確認）
      - run: pnpm build
