name: Build & Lint Check

# いつ実行するか
on:
  pull_request: # PR作成・更新時
  push:
    branches:
      - main   # mainにpushされた時

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # リポジトリを取得
      - uses: actions/checkout@v4

      # pnpmをセットアップ
      - uses: pnpm/action-setup@v4

      # Node.jsをセットアップ
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm" # pnpmのcache有効化（高速化）

      # 依存インストール（lockfile厳密）
      - run: pnpm install --frozen-lockfile

      # lintチェック（ESLintなど）
      - run: pnpm lint

      # TODO:テスト実行（今後テストコードを追加する場合）
      # - run: pnpm test

      # buildチェック（壊れてないか確認）
      - run: pnpm build