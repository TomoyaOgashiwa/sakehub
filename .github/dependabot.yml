version: 2

updates:
  # =========================================
  # ① ルート（pnpm workspace / 共通依存）
  # =========================================
  - package-ecosystem: 'npm' # pnpmでもnpmとして扱う
    directory: '/' # ルート（pnpm-lock.yamlがある場所）
    schedule:
      interval: 'weekly' # 週1回アップデートチェック
      day: 'monday'
      time: '09:00'
      timezone: 'America/Vancouver'
    open-pull-requests-limit: 5 # PRが増えすぎないよう制限
    versioning-strategy: increase # package.jsonのバージョンも更新
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'chore' # chore(deps): みたいなcommitになる
      include: 'scope'

    # Expo / RN はルートの無秩序バンプを禁止（apps/mobile 側 + expo install --fix）
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: 'nativewind'
      - dependency-name: 'react-native-css'
      - dependency-name: 'react-native-reanimated'
      - dependency-name: 'react-native-worklets'

    # PRをまとめる（重要：PR爆発防止）
    groups:
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'

      frontend-tooling:
        patterns:
          - 'vite'
          - 'eslint*'
          - '@eslint/*'
          - 'typescript'
          - 'prettier'

      # minor / patchはまとめてOK（安全）
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # =========================================
  # ② mobile（React Native / Expo系）
  # =========================================
  - package-ecosystem: 'npm'
    directory: '/apps/mobile'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Vancouver'
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - 'dependencies'
      - 'mobile'
    commit-message:
      prefix: 'chore'
      include: 'scope'

    groups:
      react-native:
        patterns:
          - 'react-native'
          - 'react-native-*'
          - 'expo'
          - 'expo-*'
          - 'nativewind'
          - 'react-native-css'
          - 'react-native-reanimated'
          - 'react-native-worklets'

      # RN系は壊れやすいのでpatch/minorまとめる
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # =========================================
  # ③ web（Next.js / React / UI）
  # =========================================
  - package-ecosystem: 'npm'
    directory: '/apps/web'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Vancouver'
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - 'dependencies'
      - 'web'
    commit-message:
      prefix: 'chore'
      include: 'scope'

    groups:
      next-react:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'

      ui:
        patterns:
          - '@radix-ui/*'
          - 'lucide-react'
          - 'tailwindcss'
          - 'class-variance-authority'
          - 'clsx'
          - 'tailwind-merge'

      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # =========================================
  # ④ GitHub Actions（CIの依存更新）
  # =========================================
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Vancouver'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
