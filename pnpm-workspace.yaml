packages:
  - 'apps/web'
  - 'apps/mobile'
  - 'packages/*'
allowBuilds:
  msgpackr-extract: false
  msw: false
  sharp: false
  unrs-resolver: false
overrides:
  lightningcss: 1.33.0
  expo-constants: 56.0.24
# pnpm ≥11.1.3 re-validates lockfile entries against minimumReleaseAge (default 1440m).
# These Expo packages were pinned while <24h old; exclude so frozen installs stay reproducible.
# See https://pnpm.io/blog/releases/11.1 and https://pnpm.io/settings#minimumreleaseageexclude
minimumReleaseAgeExclude:
  - '@expo/cli'
  - '@expo/metro-runtime'
  - '@expo/ui'
  - babel-preset-expo
  - expo
  - expo-asset
  - expo-constants
  - expo-file-system
  - expo-modules-core
  - expo-router
  - expo-symbols
  - '@expo/config-plugins'
  - '@expo/prebuild-config'
  - '@expo/router-server'
  - expo-linking
  - expo-modules-autolinking
  - expo-server
